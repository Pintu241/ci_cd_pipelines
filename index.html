<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    // create a simple html page with a header, a paragraph, and a button that changes the text of the paragraph when clicked
    <h1>Welcome to My Page</h1>
    <p id="myParagraph">This is a simple paragraph.</p>
    <button onclick="changeText()">Click Me!</button>
    <script>
        function changeText() {
            document.getElementById("myParagraph").innerText = "The text has been changed!";
        }
    </script>
</body>
</html>
